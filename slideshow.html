<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
    body.show-cursor { cursor: default; }
    #stage { position: fixed; inset: 0; }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; overflow: hidden;
    }
    .slide.in { z-index: 2; }
    .slide.out { z-index: 1; }
    .slide img {
      width: 100%; height: 100%;
      object-fit: var(--scale-mode, contain);
      user-select: none; -webkit-user-drag: none;
    }

    /* 效果類別套在各個 slide 上（而非舞台），
       且 .in 與 .out 的 img 動畫宣告相同 → 舊圖淡出時動畫無縫延續，不會瞬間跳回。

       所有數值都走 CSS 變數，由 slideshow.js 依「該效果自己的設定」逐張寫進 inline style：
         slide 元素：--dur（進出場時間）、--ease、--sf/--st（滑動）、--wipe（擦拭）、
                     --zin（縮放進場）、--czi/--czo（交錯縮放）
         img  元素：--kb-dur（慢動作時間）、--z0/--z1（起訖縮放）、--pf/--pt（平移）、
                     --rot（旋轉）、--blur/--fdur（對焦）
       img 的變數寫在 img 上（不是 slide 上），所以切換時更新 slide 的變數
       不會干擾舊圖正在跑的慢動作。 */

    /* 無效果：直接切換 */
    .slide.effect-none.in { opacity: 1; }
    .slide.effect-none.out { opacity: 0; }

    /* 淡入淡出 */
    .slide.effect-fade.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-fade.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }

    /* 滑動 */
    .slide.effect-slide.in { animation: slideIn var(--dur, 700ms) var(--ease, ease) both; }
    .slide.effect-slide.out { animation: slideOut var(--dur, 700ms) var(--ease, ease) both; }

    /* 縮放 */
    .slide.effect-zoom.in { animation: zoomIn var(--dur, 700ms) var(--ease, ease) both; }
    .slide.effect-zoom.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease) both; }

    /* 擦拭 */
    .slide.effect-wipe.in { animation: wipeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-wipe.out { animation: holdThenHide var(--dur, 700ms) linear both; }

    /* Ken Burns（緩慢縮放平移）*/
    .slide.effect-kenburns.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-kenburns.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-kenburns.in img,
    .slide.effect-kenburns.out img { animation: kbSlow var(--kb-dur, 6s) linear both; }

    /* 慢速拉遠（Ken Burns 反向）*/
    .slide.effect-zoomout.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-zoomout.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-zoomout.in img,
    .slide.effect-zoomout.out img { animation: kbSlow var(--kb-dur, 6s) linear both; }

    /* 慢速平移（畫面緩慢掃過）*/
    .slide.effect-pan.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-pan.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-pan.in img,
    .slide.effect-pan.out img { animation: panSlow var(--kb-dur, 6s) linear both; }

    /* 漂移（縮放＋微旋轉，漂浮感）*/
    .slide.effect-drift.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-drift.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-drift.in img,
    .slide.effect-drift.out img { animation: driftSlow var(--kb-dur, 6s) linear both; }

    /* 交錯縮放（上一張放大淡出、下一張縮小淡入）*/
    .slide.effect-crosszoom.in { animation: czIn var(--dur, 700ms) var(--ease, ease-out) both; }
    .slide.effect-crosszoom.out { animation: czOut var(--dur, 700ms) var(--ease, ease-in) both; }
    .slide.effect-crosszoom.in img,
    .slide.effect-crosszoom.out img { animation: kbSlow var(--kb-dur, 6s) linear both; }

    /* 對焦（模糊慢慢變清晰）*/
    .slide.effect-focus.in { animation: fadeIn var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-focus.out { animation: fadeOut var(--dur, 700ms) var(--ease, ease-in-out) both; }
    .slide.effect-focus.in img,
    .slide.effect-focus.out img { animation: focusIn var(--fdur, 2100ms) ease-out both; }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes holdThenHide { 0% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes slideIn  { from { transform: translate(var(--sf, 100%, 0)); opacity: 1; } to { transform: translate(0px, 0px); opacity: 1; } }
    @keyframes slideOut { from { transform: translate(0px, 0px); opacity: 1; } to { transform: translate(var(--st, -100%, 0)); opacity: 1; } }
    @keyframes zoomIn   { from { transform: scale(var(--zin, 1.2)); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes wipeIn   { from { clip-path: inset(var(--wipe, 0 100% 0 0)); opacity: 1; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
    /* Ken Burns / 慢速拉遠 / 交錯縮放共用：由 --z0 → --z1 */
    @keyframes kbSlow { from { transform: scale(var(--z0, 1)); } to { transform: scale(var(--z1, 1.18)); } }
    @keyframes panSlow {
      from { transform: scale(var(--z0, 1.22)) translate(var(--pf, -5%, 0)); }
      to   { transform: scale(var(--z0, 1.22)) translate(var(--pt, 5%, 0)); }
    }
    @keyframes driftSlow {
      from { transform: scale(var(--z0, 1.06)) rotate(0deg); }
      to   { transform: scale(var(--z1, 1.16)) rotate(var(--rot, 1.6deg)); }
    }
    @keyframes czIn  { from { transform: scale(var(--czi, 0.86)); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes czOut { from { transform: scale(1); opacity: 1; } to { transform: scale(var(--czo, 1.2)); opacity: 0; } }
    @keyframes focusIn {
      from { filter: blur(var(--blur, 14px)); transform: scale(var(--z0, 1.06)); }
      to   { filter: blur(0);                 transform: scale(1); }
    }

    /* ==================== Pinterest 圖牆模式 ==================== */
    /* 效能重點（低階機器如 ARM 平板也要順）：
       1. 磚塊用 <canvas> 縮圖，不放原始大圖 → 記憶體與繪製量降到幾十分之一
       2. 變暗用「一層全域黑幕」的 opacity，不是每塊磚各自跑 filter: brightness
       3. 大圖只動 transform（translate + scale），不動 left/top/width/height
       4. 不長駐 will-change，避免幾十個磚塊各自變成合成層吃光顯示記憶體 */
    #wall {
      position: fixed; inset: 0; overflow: hidden;
      padding: var(--wall-gap, 10px);
      display: none;
      background: #000;
    }
    body.wall-mode #wall { display: block; }
    body.wall-mode #stage { display: none; }
    /* 大圖完全展開後把整面牆藏起來，這段期間不用合成幾十層 */
    body.big #wall { visibility: hidden; }

    #wallInner { position: absolute; inset: var(--wall-gap, 10px); }

    .tile {
      position: absolute; left: 0; top: 0;
      transition: transform var(--push-ms, 700ms) cubic-bezier(.22,.61,.36,1);
    }
    .tile-inner {
      position: relative; width: 100%; height: 100%;
      border-radius: var(--wall-radius, 10px); overflow: hidden; background: #111;
      opacity: 0; transform: scale(0.96) translateY(10px);
      transition: opacity var(--tile-ms, 700ms) ease, transform var(--tile-ms, 700ms) ease;
    }
    .tile.shown .tile-inner { opacity: 1; transform: none; }
    /* 被移除的那張：縮小淡出，同一時間下面的磚塊往上推 */
    .tile.gone .tile-inner {
      opacity: 0; transform: scale(0.86);
      transition: opacity calc(var(--push-ms, 700ms) * 0.6) ease,
                  transform calc(var(--push-ms, 700ms) * 0.6) ease;
    }
    .tile canvas {
      display: block; width: 100%; height: 100%; object-fit: cover;
      user-select: none; -webkit-user-drag: none;
    }
    /* 每塊磚自己的黑幕：只有被聚焦的那張會用到（慢慢淡掉＝慢慢變亮）*/
    .tile-veil {
      position: absolute; inset: 0; background: #000;
      opacity: 0; pointer-events: none;
    }

    /* 全域黑幕：整個畫面變暗只靠這一層的 opacity */
    #dimVeil {
      position: fixed; inset: 0; background: #000; z-index: 4;
      opacity: 0; pointer-events: none;
      transition: opacity var(--dim-ms, 900ms) ease;
    }
    #dimVeil.on { opacity: var(--veil, 0.72); }

    /* 被選中的那張：浮到黑幕之上，自己的黑幕慢慢淡掉 */
    .tile.spot { z-index: 5; }
    .tile.spot .tile-inner {
      transform: scale(1.04);
      transition: transform var(--spot-ms, 1600ms) ease-in-out;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.35), 0 18px 50px rgba(0,0,0,0.75);
    }
    .tile.spot .tile-veil { transition: opacity var(--spot-ms, 1600ms) ease-in-out; }

    /* 大圖層：#heroBox 負責位移縮放（只動 transform），#heroImg 負責呼吸 */
    #hero {
      position: fixed; inset: 0; z-index: 6;
      background: rgba(0,0,0,0.96);
      opacity: 0; pointer-events: none;
      transition: opacity var(--fly-ms, 900ms) ease;
    }
    #hero.on { opacity: 1; }
    #heroBox {
      position: fixed; left: 0; top: 0; transform-origin: 0 0;
      transition: transform var(--fly-ms, 900ms) cubic-bezier(.22,.61,.36,1);
    }
    #heroImg {
      display: block; width: 100%; height: 100%; object-fit: contain;
      border-radius: 8px; user-select: none; -webkit-user-drag: none;
    }
    #heroImg.breathe { animation: heroBreathe var(--breathe-ms, 12s) ease-in-out infinite alternate; }
    @keyframes heroBreathe { from { transform: scale(1); } to { transform: scale(calc(1 + 0.02 * var(--i, 2))); } }

    /* 圖片資訊面板（移動滑鼠時顯示）*/
    #info {
      position: fixed; left: 24px; bottom: 24px; max-width: 70vw; z-index: 10;
      background: rgba(0,0,0,0.65); color: #eee;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      padding: 24px 32px; border-radius: 16px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #info.visible { opacity: 1; }
    #info .name { font-size: 45px; font-weight: 600; margin-bottom: 12px; }
    #info .path { font-size: 36px; color: #b8b8c0; word-break: break-all; }
    #info .meta { font-size: 36px; color: #8fb8e8; margin-top: 12px; }

    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.75); font-family: "Microsoft JhengHei", sans-serif;
      font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 16px;
      border-radius: 20px; transition: opacity 0.6s; pointer-events: none; z-index: 11;
    }
    #hint.hidden { opacity: 0; }
    #msg {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #888; font-family: sans-serif; font-size: 18px; z-index: 12;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="slide" id="slideA"><img id="imgA" /></div>
    <div class="slide" id="slideB"><img id="imgB" /></div>
  </div>
  <div id="wall"><div id="wallInner"></div></div>
  <div id="dimVeil"></div>
  <div id="hero"><div id="heroBox"><img id="heroImg" /></div></div>
  <div id="info">
    <div class="name" id="info-name"></div>
    <div class="path" id="info-path"></div>
    <div class="meta" id="info-meta"></div>
  </div>
  <div id="hint" data-i18n="hint.slideshow">點擊滑鼠或按任意鍵退出；移動滑鼠可查看圖片資訊</div>
  <div id="msg" style="display:none"></div>
  <script src="i18n.js"></script>
  <script src="fx.js"></script>
  <script src="slideshow.js"></script>
</body>
</html>
